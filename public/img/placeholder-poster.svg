<svg xmlns="http://www.w3.org/2000/svg" width="300" height="450" viewBox="0 0 300 450" role="img" aria-labelledby="title desc">
  <title id="title">Poster placeholder</title>
  <desc id="desc">Fallback image when movie poster is missing.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#2f2f2f"/>
    </linearGradient>
  </defs>
  <rect width="300" height="450" fill="url(#bg)"/>
  <rect x="18" y="18" width="264" height="414" fill="none" stroke="#ed8e00" stroke-width="2" opacity="0.75"/>
  <circle cx="150" cy="170" r="42" fill="none" stroke="#ed8e00" stroke-width="5"/>
  <path d="M150 144 L150 196 M124 170 L176 170" stroke="#ed8e00" stroke-width="5" stroke-linecap="round"/>
  <text x="150" y="255" fill="#f2f2f2" font-size="20" font-family="Arial, sans-serif" text-anchor="middle" letter-spacing="2">NO IMAGE</text>
  <text x="150" y="285" fill="#9a9a9a" font-size="12" font-family="Arial, sans-serif" text-anchor="middle" letter-spacing="1">REX CINEMAS</text>
</svg>
